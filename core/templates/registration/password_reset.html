<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · Finance Ledger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg: #15130F; --box: #FAF3E7; --accent: #B8863B; --accent-hover: #8C6529; --glow: #D9A857; --text-on-dark: #EDE6D8; --text-on-light: #241F1B; --muted-dark: #9C9187; --muted-light: #6B6156; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-on-dark); min-height: 100vh; overflow-x: hidden; overflow-y: auto; position: relative; }
        .background { position: absolute; inset: 0; z-index: -1; }
        canvas { position: absolute; inset: 0; opacity: 0.7; }
        .content { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        .reset-box { background: var(--box); border: 1px solid rgba(36,31,27,0.08); border-radius: 24px; padding: 3rem 2.8rem; box-shadow: 0 30px 70px -15px rgba(0,0,0,0.55); width: 100%; max-width: 440px; text-align: center; }
        .icon-wrap { width: 56px; height: 56px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, #B8863B, #D9A857); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .reset-box h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.85rem; margin-bottom: 0.6rem; color: var(--text-on-light); }
        .reset-box p.sub { color: var(--muted-light); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5; }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.55rem; font-size: 0.9rem; font-weight: 500; color: var(--text-on-light); }
        input { width: 100%; padding: 15px 20px; background: #FFFFFF; border: 1.5px solid #DED2BB; border-radius: 14px; color: var(--text-on-light); font-size: 1.06rem; }
        input::placeholder { color: #B3A692; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(184, 134, 59, 0.18); outline: none; }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #B8863B, #D9A857); color: #15130F; border: none; border-radius: 14px; font-size: 1.08rem; font-weight: 600; cursor: pointer; transition: all 0.35s ease; box-shadow: 0 8px 20px rgba(184, 134, 59, 0.35); }
        .btn:hover { background: linear-gradient(135deg, #8C6529, #B8863B); transform: translateY(-4px); box-shadow: 0 15px 30px rgba(184, 134, 59, 0.45); }
        .back { display: block; text-align: center; margin-top: 1.8rem; color: var(--muted-light); font-size: 0.9rem; text-decoration: none; }
        .back:hover { color: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="background"><canvas id="canvas"></canvas></div>
    <div class="content">
        <div class="reset-box">
            <div class="icon-wrap"><i data-lucide="key-round" style="color:#15130F"></i></div>
            <h2>Reset password</h2>
            <p class="sub">Enter your email and we'll send you a link to reset your password.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" id="id_email" placeholder="you@company.com" required>
                </div>
                <button type="submit" class="btn">Send Reset Link</button>
            </form>
            <a href="{% url 'login' %}" class="back">← Back to login</a>
        </div>
    </div>
    <script>
        lucide.createIcons();
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random()*w; this.y = Math.random()*h; this.size = Math.random()*2.6+0.6; this.speedX = Math.random()*0.6-0.3; this.speedY = Math.random()*0.6-0.3; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x<0||this.x>w) this.speedX*=-1; if (this.y<0||this.y>h) this.speedY*=-1; }
            draw() { ctx.fillStyle='#D9A857'; ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
        }
        const particles = Array.from({length: 85}, () => new Particle());
        function animate() { ctx.clearRect(0,0,w,h); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>
</html>
