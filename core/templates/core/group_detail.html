<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ group.name }} — Finance App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    /* TOP NAV */
    .navbar {
      background: white;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .navbar-left { display: flex; align-items: center; gap: 16px; }
    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #6b7280;
    }
    .navbar-title { font-size: 18px; font-weight: 700; color: #111827; }
    .navbar-right { display: flex; align-items: center; gap: 16px; }
    .logout-btn {
      padding: 7px 16px;
      background: #f3f4f6;
      color: #374151;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }

    /* MAIN */
    .main { padding: 24px; max-width: 100%; overflow: auto; }

    /* TABLE */
    .table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: #f8f9fa;
      padding: 14px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid #e5e7eb;
      white-space: nowrap;
    }
    th.sticky { position: sticky; left: 0; background: #f8f9fa; z-index: 2; }
    th.date { min-width: 75px; }
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 13px;
    }
    td.sticky { position: sticky; left: 0; background: white; z-index: 1; }
    td.name-cell { font-weight: 600; color: #111827; }
    td.number-cell { text-align: right; color: #374151; }
    td.amount-cell {
      background: #f3f4f6;
      text-align: center;
      cursor: pointer;
      transition: background 0.1s;
    }
    td.amount-cell:hover { background: #e5e7eb; }
    td.amount-cell input {
      width: 100%;
      border: none;
      background: white;
      padding: 6px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
    td.amount-cell input:focus {
      outline: 2px solid #1a56db;
    }
    td.total-row { background: #f8f9fa; font-weight: 600; }
    td.total-number { background: #f8f9fa; color: #111827; }

    /* ACTIONS */
    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .delete-btn:hover { background: #fecaca; }

    /* ADD NEW BORROWER */
    .add-row {
      background: #f8f9fa;
    }
    .add-row td {
      padding: 16px 12px;
      border: none;
    }
    .add-form {
      display: grid;
      grid-template-columns: 150px 120px 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .add-form input {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    .add-form input:focus {
      outline: 2px solid #1a56db;
      border: none;
    }
    .btn-add {
      background: #1a56db;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-add:hover { background: #1648c0; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .add-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-left">
      <a href="/dashboard/" class="back-btn">← Back</a>
      <div class="navbar-title">{{ group.name }}</div>
    </div>
    <div class="navbar-right">
      <a href="/logout/" class="logout-btn">Logout</a>
    </div>
  </nav>

  <div class="main">
    <div class="table-container">
      <table id="emiTable">
        <thead>
          <tr>
            <th class="sticky">Sr.No</th>
            <th class="sticky">Name</th>
            <th class="sticky">Amount Given</th>
            <th class="sticky">Amount Paid</th>
            <th class="sticky">Balance</th>
            {% for week in weeks %}
            <th class="date">{{ week.display }}</th>
            {% endfor %}
            <th class="sticky" style="width: 60px;">Action</th>
          </tr>
        </thead>
        <tbody id="borrowersBody">
          <!-- Populated by JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Data passed from Django view as JSON
    const borrowersData = {{ borrowers|safe }};
    const weeksData = {{ weeks|safe }};
    const dailyTotalsData = {{ daily_totals|safe }};
    const groupId = {{ group.id }};

    // Initialize the table on page load
    document.addEventListener('DOMContentLoaded', function() {
      renderTable();
    });

    function renderTable() {
      const tbody = document.getElementById('borrowersBody');
      tbody.innerHTML = '';

      // Add borrower rows
      borrowersData.forEach((borrower, index) => {
        const row = document.createElement('tr');
        row.className = 'borrower-row';
        row.dataset.borrowerId = borrower.id;

        let html = `
          <td class="sticky number-cell">${index + 1}</td>
          <td class="sticky name-cell editable-name">${borrower.name}</td>
          <td class="number-cell editable-amount">₹${Math.round(borrower.amount_given)}</td>
          <td class="number-cell total-paid">₹${borrower.total_paid.toFixed(2)}</td>
          <td class="number-cell balance">₹${borrower.balance.toFixed(2)}</td>
        `;

        // Add payment cells for each week
        weeksData.forEach(week => {
          const paymentAmount = borrower.payments[week.date] || 0;
          const displayValue = paymentAmount > 0 ? `₹${paymentAmount}` : '—';
          html += `
            <td class="amount-cell" data-date="${week.date}" data-borrower-id="${borrower.id}">
              <span>${displayValue}</span>
            </td>
          `;
        });

        html += `
          <td class="sticky">
            <button class="delete-btn" onclick="deleteBorrower(${borrower.id})">Delete</button>
          </td>
        `;

        row.innerHTML = html;
        tbody.appendChild(row);
      });

      // Add total row
      const totalRow = document.createElement('tr');
      totalRow.className = 'total-row';
      let totalHtml = `
        <td class="sticky total-number" colspan="5">TOTAL COLLECTION</td>
      `;

      weeksData.forEach(week => {
        const total = dailyTotalsData[week.date] || 0;
        totalHtml += `
          <td class="amount-cell total-amount" data-date="${week.date}">
            ₹${Math.round(total)}
          </td>
        `;
      });

      totalHtml += '<td></td>';
      totalRow.innerHTML = totalHtml;
      tbody.appendChild(totalRow);

      // Add new borrower row
      const addRow = document.createElement('tr');
      addRow.className = 'add-row';
      addRow.innerHTML = `
        <td colspan="100">
          <div class="add-form">
            <input type="text" id="newName" placeholder="Borrower name" maxlength="50">
            <input type="number" id="newAmount" placeholder="Amount" min="0" step="100">
            <div></div>
            <button class="btn-add" onclick="addBorrower()">+ Add Borrower</button>
          </div>
        </td>
      `;
      tbody.appendChild(addRow);

      // Attach event listeners
      attachEventListeners();
    }

    function attachEventListeners() {
      // Make payment cells editable
      document.querySelectorAll('.amount-cell:not(.total-amount)').forEach(cell => {
        cell.addEventListener('click', function(e) {
          editPaymentCell(this);
        });
      });

      // Make name editable
      document.querySelectorAll('.editable-name').forEach(cell => {
        cell.addEventListener('click', function(e) {
          editNameCell(this);
        });
      });

      // Make amount given editable
      document.querySelectorAll('.editable-amount').forEach(cell => {
        cell.addEventListener('click', function(e) {
          editAmountCell(this);
        });
      });
    }

    function editPaymentCell(cell) {
      const borrowerId = cell.dataset.borrowerId;
      const date = cell.dataset.date;
      const currentValue = cell.innerText.replace('₹', '').replace('—', '').trim();

      const input = document.createElement('input');
      input.type = 'number';
      input.value = currentValue === '' ? '' : parseFloat(currentValue);
      input.min = '0';
      input.step = '100';
      input.style.width = '100%';

      cell.innerHTML = '';
      cell.appendChild(input);
      input.focus();
      input.select();

      const savePayment = function() {
        const amount = parseFloat(input.value) || 0;
        savePaymentData(borrowerId, date, amount);
      };

      input.onblur = savePayment;
      input.onkeypress = function(e) {
        if (e.key === 'Enter') savePayment();
      };
    }

    function editNameCell(cell) {
      const row = cell.closest('.borrower-row');
      const borrowerId = row.dataset.borrowerId;
      const currentValue = cell.innerText;

      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentValue;
      input.maxLength = '50';

      cell.innerHTML = '';
      cell.appendChild(input);
      input.focus();
      input.select();

      const saveName = function() {
        const name = input.value.trim();
        if (name) saveBorrowerData(borrowerId, { name: name });
      };

      input.onblur = saveName;
      input.onkeypress = function(e) {
        if (e.key === 'Enter') saveName();
      };
    }

    function editAmountCell(cell) {
      const row = cell.closest('.borrower-row');
      const borrowerId = row.dataset.borrowerId;
      const currentValue = cell.innerText.replace('₹', '').trim();

      const input = document.createElement('input');
      input.type = 'number';
      input.value = parseFloat(currentValue);
      input.min = '0';
      input.step = '100';

      cell.innerHTML = '';
      cell.appendChild(input);
      input.focus();
      input.select();

      const saveAmount = function() {
        const amount = parseFloat(input.value) || 0;
        if (amount > 0) saveBorrowerData(borrowerId, { amount_given: amount });
      };

      input.onblur = saveAmount;
      input.onkeypress = function(e) {
        if (e.key === 'Enter') saveAmount();
      };
    }

    // Save payment data to server
    function savePaymentData(borrowerId, date, amount) {
      fetch(`/api/borrower/${borrowerId}/update-payment/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify({ date: date, amount: amount }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          location.reload();
        }
      });
    }

    // Save borrower name/amount data
    function saveBorrowerData(borrowerId, updates) {
      fetch(`/api/borrower/${borrowerId}/update/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify(updates),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          location.reload();
        }
      });
    }

    // Delete borrower
    function deleteBorrower(borrowerId) {
      if (confirm('Delete this borrower? This cannot be undone.')) {
        fetch(`/api/borrower/${borrowerId}/delete/`, {
          method: 'POST',
          headers: {
            'X-CSRFToken': getCookie('csrftoken'),
          },
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            location.reload();
          }
        });
      }
    }

    // Add new borrower
    function addBorrower() {
      const name = document.getElementById('newName').value.trim();
      const amount = parseFloat(document.getElementById('newAmount').value) || 0;

      if (!name || amount <= 0) {
        alert('Please enter valid name and amount');
        return;
      }

      fetch(`/api/group/${groupId}/add-borrower/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify({ name: name, amount_given: amount }),
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          location.reload();
        }
      });
    }

    // Get CSRF token
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
  </script>

</body>
</html>
